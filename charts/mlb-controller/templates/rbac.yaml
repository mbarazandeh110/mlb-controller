{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mlb-controller.fullname" . }}
  labels:
    {{- include "mlb-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - services
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mlb-controller.fullname" . }}
  labels:
    {{- include "mlb-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mlb-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mlb-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- if .Values.config.leader_election.enabled }}
{{- $leaseNamespace := default .Release.Namespace .Values.config.leader_election.lease_namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mlb-controller.fullname" . }}-leader-election
  namespace: {{ $leaseNamespace }}
  labels:
    {{- include "mlb-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mlb-controller.fullname" . }}-leader-election
  namespace: {{ $leaseNamespace }}
  labels:
    {{- include "mlb-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mlb-controller.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "mlb-controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
