replicaCount: 2

image:
  repository: repo.neor-data.info/public/mlb-controller
  pullPolicy: IfNotPresent
  tag: "0.0.2"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mlb-controller
          topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

service:
  type: ClusterIP
  port: 9090

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  additionalLabels: {}

tlsSecrets: []
  # - name: cdn-nginx-tls
  #   secretName: cdn-nginx-tls-secret
  #   mountPath: /etc/mlb-controller/certs/cdn-nginx

config:
  global_upstream_sync_period: 10s
  request_pool_size: 10

  leader_election:
    enabled: true
    lease_name: mlb-controller-leader
    lease_namespace: ""
    lease_duration: 15s
    renew_deadline: 10s
    retry_period: 2s

  log:
    enabled: true
    level: info
    format: json

  metrics:
    enabled: true
    port: 9090
    uri: /metrics

  kubernetes:
    resync_period: 30s
    kubernetes_config: ""

  global_ip_replacement_list:
    net: []
      # - name: cdn1
      #   nets:
      #     - source: 192.168.1.0
      #       target: 10.0.0.0
      #       mask: 24
    ip: []
      # - name: lb2
      #   ips:
      #     - source: 192.168.1.10
      #       target: 10.0.0.10

  loadbalancers:
    - type: nginx
      name: CDN
      protocol: http
      hostname: example.test
      addresses:
        - ip: 192.168.10.10
          port: 80
      list_api: /api/upstream
      add_api: /dynamic
      remove_api: /dynamic
      upstream_sync_period: 10s
      fail_timeout: 60s
      request_timeout: 30s
      request_pool_size: 10
      allow_empty_upstream: false
      default_backend:
        ip: 10.0.0.99
        port: 8080
        weight: 1
      ip_replacement: false
      ip_replacement_list:
        nets: []
        ips: []
        global_nets: []
        global_ips: []
